
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 180"
     width="1200"
     height="180">

  <defs>
    <style>
      .fall {
        animation: falling 7s linear infinite;
        opacity: 0;
      }

      @keyframes falling {
        0% {
          transform: translate(0, -15px);
          opacity: 0;
        }
        15% {
          opacity: 0.9;
        }
        80% {
          opacity: 0.7;
        }
        100% {
          transform: translate(12px, 200px);
          opacity: 0;
        }
      }

      .slow { animation-duration: 10s; }
      .fast { animation-duration: 5s; }
    </style>
  </defs>

  <!-- Tiny falling sparkles -->
  <g fill="#FFB7D5">
    <g transform="translate(35,0)">
      <circle class="fall fast" r="1.8" style="animation-delay:0s"/>
    </g>
    <g transform="translate(145,0)">
      <circle class="fall slow" r="1.3" style="animation-delay:2s"/>
    </g>
    <g transform="translate(260,0)">
      <circle class="fall" r="2" style="animation-delay:4s"/>
    </g>
    <g transform="translate(390,0)">
      <circle class="fall fast" r="1.2" style="animation-delay:1s"/>
    </g>
    <g transform="translate(510,0)">
      <circle class="fall slow" r="1.7" style="animation-delay:5s"/>
    </g>
    <g transform="translate(650,0)">
      <circle class="fall" r="1.4" style="animation-delay:2.5s"/>
    </g>
    <g transform="translate(780,0)">
      <circle class="fall fast" r="1.8" style="animation-delay:3s"/>
    </g>
    <g transform="translate(920,0)">
      <circle class="fall slow" r="1.2" style="animation-delay:1.5s"/>
    </g>
    <g transform="translate(1060,0)">
      <circle class="fall" r="2" style="animation-delay:4.5s"/>
    </g>
    <g transform="translate(1160,0)">
      <circle class="fall fast" r="1.4" style="animation-delay:0.8s"/>
    </g>
  </g>

  <g fill="#C3A6FF">
    <g transform="translate(90,0)">
      <circle class="fall slow" r="1.5" style="animation-delay:3s"/>
    </g>
    <g transform="translate(210,0)">
      <circle class="fall fast" r="1.8" style="animation-delay:1s"/>
    </g>
    <g transform="translate(340,0)">
      <circle class="fall" r="1.3" style="animation-delay:5s"/>
    </g>
    <g transform="translate(470,0)">
      <circle class="fall slow" r="2" style="animation-delay:0.5s"/>
    </g>
    <g transform="translate(590,0)">
      <circle class="fall fast" r="1.4" style="animation-delay:3.5s"/>
    </g>
    <g transform="translate(720,0)">
      <circle class="fall" r="1.7" style="animation-delay:2s"/>
    </g>
    <g transform="translate(850,0)">
      <circle class="fall slow" r="1.3" style="animation-delay:4s"/>
    </g>
    <g transform="translate(990,0)">
      <circle class="fall fast" r="1.8" style="animation-delay:1.8s"/>
    </g>
    <g transform="translate(1120,0)">
      <circle class="fall" r="1.4" style="animation-delay:5.5s"/>
    </g>
  </g>

  <g fill="#FFFFFF">
    <g transform="translate(65,0)">
      <circle class="fall" r="1.2" style="animation-delay:2s"/>
    </g>
    <g transform="translate(180,0)">
      <circle class="fall slow" r="1.8" style="animation-delay:4s"/>
    </g>
    <g transform="translate(300,0)">
      <circle class="fall fast" r="1.3" style="animation-delay:0.5s"/>
    </g>
    <g transform="translate(430,0)">
      <circle class="fall" r="1.7" style="animation-delay:3s"/>
    </g>
    <g transform="translate(550,0)">
      <circle class="fall slow" r="1.2" style="animation-delay:1s"/>
    </g>
    <g transform="translate(680,0)">
      <circle class="fall fast" r="1.8" style="animation-delay:4.5s"/>
    </g>
    <g transform="translate(810,0)">
      <circle class="fall" r="1.3" style="animation-delay:2.5s"/>
    </g>
    <g transform="translate(950,0)">
      <circle class="fall slow" r="1.7" style="animation-delay:5s"/>
    </g>
    <g transform="translate(1090,0)">
      <circle class="fall fast" r="1.2" style="animation-delay:1.5s"/>
    </g>
  </g>
</svg>
